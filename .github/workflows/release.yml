name: Build ARM64 plugin package

# 打 tag（如 v1.3.4-arm64.1）时自动出包并发布 Release；
# 也可以在 Actions 页面手动触发（workflow_dispatch）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      upstream_version:
        description: '上游 DeckyClash 版本 tag（如 v1.3.4；留空取最新）'
        required: false
        default: ''
      core_arch:
        description: 'mihomo 资产后缀'
        required: false
        default: 'arm64'
      plugin_name:
        description: '插件显示名'
        required: false
        default: 'Decky Clash ARM64'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve versions
        id: ver
        env:
          INPUT_UPSTREAM: ${{ github.event.inputs.upstream_version }}
          INPUT_ARCH: ${{ github.event.inputs.core_arch }}
          INPUT_NAME: ${{ github.event.inputs.plugin_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # 上游版本：手动输入 > tag 里的基础版本（v1.3.4-arm64.1 -> v1.3.4）> 最新
          UPSTREAM="${INPUT_UPSTREAM:-}"
          if [ -z "$UPSTREAM" ]; then
            UPSTREAM="$(printf '%s' "$REF_NAME" | grep -oE '^v[0-9]+\.[0-9]+\.[0-9]+' || true)"
          fi
          if [ -z "$UPSTREAM" ]; then
            UPSTREAM="v$(curl -fsSL https://api.github.com/repos/chenx-dust/DeckyClash/releases/latest \
                        | python3 -c 'import json,sys;print(json.load(sys.stdin)["tag_name"].lstrip("v"))')"
          fi

          ARCH="${INPUT_ARCH:-arm64}"
          NAME="${INPUT_NAME:-Decky Clash ARM64}"

          echo "upstream=$UPSTREAM"        >> "$GITHUB_OUTPUT"
          echo "arch=$ARCH"               >> "$GITHUB_OUTPUT"
          echo "name=$NAME"               >> "$GITHUB_OUTPUT"
          echo "上游版本: $UPSTREAM / 架构: $ARCH / 插件名: $NAME"

      - name: Fetch upstream package
        env:
          UPSTREAM: ${{ steps.ver.outputs.upstream }}
        run: |
          set -euo pipefail
          URL="https://github.com/chenx-dust/DeckyClash/releases/download/${UPSTREAM}/DeckyClash-full.zip"
          echo "下载 $URL"
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors -o DeckyClash-full.zip "$URL"
          python3 -c "import zipfile;zipfile.ZipFile('DeckyClash-full.zip').testzip()"
          ls -l DeckyClash-full.zip

      - name: Fetch mihomo core
        id: core
        env:
          ARCH: ${{ steps.ver.outputs.arch }}
        run: |
          set -euo pipefail
          V=$(curl -fsSL https://github.com/MetaCubeX/mihomo/releases/latest/download/version.txt)
          URL="https://github.com/MetaCubeX/mihomo/releases/download/${V}/mihomo-linux-${ARCH}-${V}.gz"
          echo "下载 $URL"
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors -o core.gz "$URL"
          gzip -t core.gz
          ls -l core.gz
          echo "core_version=$V" >> "$GITHUB_OUTPUT"

      - name: Build plugin packages
        env:
          ARCH: ${{ steps.ver.outputs.arch }}
          NAME: ${{ steps.ver.outputs.name }}
          UPSTREAM: ${{ steps.ver.outputs.upstream }}
        run: |
          set -euo pipefail
          # ① 独立身份版：插件名 Decky Clash ARM64，可与官方版共存
          OUT="DeckyClash-${ARCH}-${UPSTREAM}.zip"
          python3 scripts/build.py \
            --src  DeckyClash-full.zip \
            --core core.gz \
            --out  "$OUT" \
            --rename "$NAME" \
            --author "decky-clash-arm64 (upstream: Chenx Dust)"
          # ② 同名覆盖版：保持上游身份，设置与订阅延续（给已装官方版的人升级用）
          OUT2="DeckyClash-${ARCH}-${UPSTREAM}-dropin.zip"
          python3 scripts/build.py \
            --src  DeckyClash-full.zip \
            --core core.gz \
            --out  "$OUT2" \
            --drop-in
          {
            echo "OUT=$OUT"
            echo "OUT2=$OUT2"
          } >> "$GITHUB_ENV"
          ls -l "$OUT" "$OUT2"

      - name: Smoke test bundled core
        env:
          ARCH: ${{ steps.ver.outputs.arch }}
        run: |
          set -euo pipefail
          # 只有当 runner 架构恰好和包内一致时才能真正执行，否则只校验文件
          python3 - <<'PY'
          import os, zipfile
          for key in ("OUT", "OUT2"):
              z = zipfile.ZipFile(os.environ[key])
              names = z.namelist()
              top = sorted({n.split("/")[0] for n in names})
              assert len(top) == 1, f"{key}: ZIP 根目录不唯一 {top}"

              mihomo = [n for n in names if n.endswith("bin/mihomo")]
              assert mihomo, f"{key}: 包里没有 bin/mihomo"
              info = z.getinfo(mihomo[0])
              assert info.external_attr >> 16 & 0o111, f"{key}: bin/mihomo 没有可执行位"

              up = [n for n in names if n.endswith("py_modules/upgrade.py")]
              src = z.read(up[0]).decode()
              assert "CORE_ARCH" in src, f"{key}: upgrade.py 缺少架构探测补丁"
              assert "mihomo-linux-amd64-" not in src, f"{key}: upgrade.py 仍写死 amd64"

              import json
              pj = json.loads(z.read(f"{top[0]}/plugin.json"))
              front = z.read(f"{top[0]}/dist/index.js").decode("utf-8", "replace")
              # 前端 definePlugin 的 name 必须和后端插件名一致，否则面板拉不到数据
              assert f'"{pj["name"]}"' in front, \
                  f"{key}: 前端里找不到插件名 {pj['name']!r}，RPC 会失效"
              print(f"{key}: {top[0]} / mihomo {info.file_size}B mode "
                    f"{oct(info.external_attr >> 16)} / upgrade.py OK / 名字一致 OK")
          PY
          # 在原生架构 runner 上顺带跑一次内核
          mkdir -p /tmp/smoke
          python3 -c "import zipfile,os;zipfile.ZipFile(os.environ['OUT']).extractall('/tmp/smoke')"
          BIN=$(find /tmp/smoke -name mihomo -type f | head -1)
          chmod +x "$BIN"
          "$BIN" -v || echo "（runner 架构与包不一致，跳过执行验证）"

      - name: Checksums
        run: |
          sha256sum "$OUT" "$OUT2" core.gz | tee SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: decky-clash-arm64
          path: |
            ${{ env.OUT }}
            ${{ env.OUT2 }}
            SHA256SUMS.txt

      - name: Write release notes
        env:
          ARCH: ${{ steps.ver.outputs.arch }}
          NAME: ${{ steps.ver.outputs.name }}
          UPSTREAM: ${{ steps.ver.outputs.upstream }}
          CORE: ${{ steps.core.outputs.core_version }}
          REPO: ${{ github.repository }}
          OUT: ${{ env.OUT }}
          OUT2: ${{ env.OUT2 }}
        run: |
          cat > RELEASE_NOTES.md <<EOF
          基于上游 [DeckyClash](https://github.com/chenx-dust/DeckyClash) \`${UPSTREAM}\`，
          内核 [mihomo](https://github.com/MetaCubeX/mihomo) \`${CORE}\` (${ARCH})。

          ## 两个包，装哪个？

          | 文件 | 插件名 | 适用于 |
          | --- | --- | --- |
          | \`${OUT}\` | \`Decky Clash ARM64\` | **新装用户（推荐）**，可与官方版共存 |
          | \`${OUT2}\` | \`Decky Clash\` | 已装过官方版、想让设置和订阅延续的人（同名覆盖） |

          > ⚠️ 两个包不要同时启用 —— 会抢同一组端口（默认 9090 / 50581）。

          ## 为什么需要这个包

          ARM64 机器上装官方包后，导入任何订阅都报 \`Invalid config\`：
          官方版把内核下载地址写死成 \`mihomo-linux-amd64-*\`，在 ARM64 上装到的
          x86-64 内核经 binfmt/FEX 模拟执行时，Go 运行时的 CPU 特征探测会 SIGSEGV，
          于是 \`mihomo -t\` 崩溃 → \`check_config\` 返回 False → 插件报 Invalid config。
          **订阅本身没问题。** 本包改两处：\`py_modules/upgrade.py\` 改为运行时架构探测、
          \`bin/mihomo\` 换成官方 arm64 二进制。

          ## 安装

          Decky → 设置 → 通用 → 打开**开发者模式** → **开发者** → **从 ZIP 安装插件**
          → 选上面的 ZIP（**不是 Source code**）。

          装完自检（应打印 \`linux ${ARCH}\` 且退出码 0）：

          \`\`\`sh
          ~/homebrew/plugins/"${NAME}"/bin/mihomo -v
          \`\`\`

          打印 \`linux amd64\` 或直接段错误，说明装到官方包了。

          更多排查看 [README](https://github.com/${REPO}#排查)。
          EOF
          echo "--- 发布说明预览 ---"
          head -20 RELEASE_NOTES.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          gh release create "${GITHUB_REF_NAME}" \
            "$OUT" "$OUT2" SHA256SUMS.txt \
            --title "$OUT" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag \
            > /tmp/rel.log 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            {
              echo "## ✅ Release 发布成功"
              echo
              gh release view "${GITHUB_REF_NAME}" --json url -q .url
            } >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/rel.log
          else
            {
              echo "## ❌ Release 发布失败（exit $rc）"
              echo
              echo '```'
              tail -40 /tmp/rel.log
              echo '```'
              echo
              echo "仓库: \`${GITHUB_REPOSITORY}\`  ref: \`${GITHUB_REF}\`"
              echo "提示: 若报 \`Resource not accessible by integration\` 或 403，"
              echo "请在 Settings → Actions → General → Workflow permissions 里"
              echo "选择 **Read and write permissions** 后重新运行。"
            } >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/rel.log
            exit "$rc"
          fi
